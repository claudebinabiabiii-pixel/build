name: Flutter Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ke ZIP project Flutter'
        required: true
      tag:
        description: 'Tag/ID build'
        required: true
      build_type:
        description: 'Build type (release/debug)'
        required: false
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Download project
        run: |
          mkdir -p work
          cd work
          wget -q "${{ github.event.inputs.zip_url }}" -O project.zip
          unzip -q project.zip
          rm project.zip
          ls -la

      - name: Find project
        id: project
        run: |
          cd work
          if [ -f pubspec.yaml ]; then
            echo "path=." >> $GITHUB_OUTPUT
          else
            DIR=$(find . -name pubspec.yaml -type f | head -1 | xargs dirname)
            echo "path=$DIR" >> $GITHUB_OUTPUT
          fi

      - name: Get dependencies
        working-directory: work/${{ steps.project.outputs.path }}
        run: |
          flutter clean
          flutter pub get

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release'
        working-directory: work/${{ steps.project.outputs.path }}
        run: flutter build apk --release

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'debug'
        working-directory: work/${{ steps.project.outputs.path }}
        run: flutter build apk --debug

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'release' && success()
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: work/${{ steps.project.outputs.path }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Upload Debug APK
        if: github.event.inputs.build_type == 'debug' && success()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: work/${{ steps.project.outputs.path }}/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
